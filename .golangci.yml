run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

output:
  formats:
    - format: colored-line-number
      path: stdout
  print-issued-lines: true
  print-linter-name: true

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  
  govet:
    enable-all: true
    disable:
      - shadow
      - fieldalignment
  
  gocyclo:
    min-complexity: 20
  
  dupl:
    threshold: 150
  
  goconst:
    min-len: 3
    min-occurrences: 5
  
  misspell:
    locale: US
  
  lll:
    line-length: 150
  
  funlen:
    lines: 100
    statements: 60
  
  gocognit:
    min-complexity: 25

linters:
  enable:
    - bodyclose
    - errcheck
    - gofmt
    - gosec
    - gosimple
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - typecheck
    - unused
    - goconst
    - gocyclo
  
  disable:
    - depguard
    - goimports
    - stylecheck
    - noctx
    - mnd
    - gocritic
    - lll
    - funlen
    - gocognit
    - dupl

issues:
  exclude-dirs:
    - vendor
    - bin
    - docs
    - .git
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*\\.gen\\.go$"
    - ".*_test\\.go$"
  exclude-rules:
    # Exclude gosec for test files
    - path: _test\.go
      linters:
        - gosec
        - errcheck
    
    # Exclude some gosec messages
    - linters:
        - gosec
      text: "G404:" # Random number generation
    
    - linters:
        - gosec
      text: "G101:" # Hardcoded credentials
    
    - linters:
        - gosec
      text: "G304:" # File inclusion via variable

  exclude-use-default: true
  max-issues-per-linter: 50
  max-same-issues: 10
  new: false

severity:
  default-severity: error
  case-sensitive: false 